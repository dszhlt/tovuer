[package]
name = "tovuer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tovuer — voice and text chat right in the terminal, peer to peer: every user is a node"

[[bin]]
name = "tovuer"
path = "src/main.rs"

[dependencies]
tovuer-proto.workspace = true
tovuer-voice.workspace = true
tovuer-node.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# sharp pictures: Sixel, Kitty and iTerm2 graphics, where the terminal has them
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
unicode-segmentation = "1"
# /update from GitHub releases: the same HTTPS stack iroh already builds
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
