[package]
name = "tovuer-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tovuer voice engine: Opus, noise suppression, jitter buffer, mixer"

[dependencies]
cpal = "0.18"
nnnoiseless = { version = "0.5", default-features = false }
unsafe-libopus = "0.2"

# On Linux talk to PulseAudio/PipeWire directly (pure Rust, no libpulse):
# proper device names and shared access to audio. ALSA stays as a fallback.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
